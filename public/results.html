<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>ACL Schedule Planner</title>
  <meta name="theme-color" content="#f5a300" />
  <meta name="apple-mobile-web-app-title" content="ACL Planner" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <div class="kicker">Austin Parks Foundation Presents</div>
      <h1>Austin City Limits</h1>
      <div class="sub">Music Festival &middot; Weekend One</div>
      <div class="dates">October 02–04 &middot; 2026</div>
    </header>

    <div class="toolbar">
      <div class="days" id="days"></div>
      <div class="actions">
        <a class="btn ghost" href="/weekend">Weekend →</a>
        <a class="btn primary" href="/">← Pick / Edit yours</a>
      </div>
    </div>

    <div class="count-strip" id="countStrip">Loading…</div>
    <div class="net-status" id="netStatus"></div>
    <div class="legend">
      <span><span class="sw" style="background:#fce1a2"></span>No picks</span>
      <span><span class="sw" style="background:#f7a13a"></span>A few</span>
      <span><span class="sw" style="background:#ff2e9a"></span>Crowd favorite</span>
      <span style="opacity:.8">Hover / tap a box to see who</span>
    </div>

    <div id="grid"></div>
  </div>

  <div id="tip"><div class="t-title"></div><div class="t-names"></div></div>

  <script src="/offline.js"></script>
  <script src="/grid.js"></script>
  <script src="/results.js"></script>
</body>
</html>
