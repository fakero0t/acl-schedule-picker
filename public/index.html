<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>ACL Schedule Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <nav class="site-nav" aria-label="Pages">
      <a href="/">Itinerary</a>
      <a href="/results">Results</a>
      <a href="/map">Map</a>
    </nav>
    <header class="mast">
      <div class="kicker">ACL Schedule Planner</div>
      <h1>Austin City Limits 2026</h1>
      <div class="sub">Pick Your Favorites</div>
    </header>

    <div class="toolbar centered">
      <div class="days" id="days"></div>
    </div>

    <div class="hint" id="hint">Tap an artist, then pick <b>Definitely</b> or <b>Maybe</b>.</div>

    <div id="grid"></div>
  </div>

  <!-- name modal -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>Who's picking?</h2>
      <p>Your name so your friends know who voted for what.</p>
      <input id="nameInput" placeholder="e.g. Ary" maxlength="40" autocomplete="off" />
      <button class="btn primary" id="nameGo" style="width:100%">Let's go</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/grid.js"></script>
  <script src="/app.js"></script>
</body>
</html>
